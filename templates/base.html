<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Dark Web Monitor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
        .navbar-brand { font-weight: bold; }
        .status-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
        .keyword-badge { margin: 2px; }
        .result-card { margin-bottom: 15px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <i class="fas fa-eye"></i> Dark Web Monitor
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('index') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('keywords') }}">Palavras-chave</a>
            <a class="nav-link" href="{{ url_for('urls') }}">URLs</a>
            <a class="nav-link" href="{{ url_for('upload_urls') }}">Upload URLs</a>	    
	    <a class="nav-link" href="{{ url_for('results') }}">Resultados</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function checkTorStatus() {
        fetch('/status')
            .then(r => r.json())
            .then(data => {
                const indicator = document.getElementById('tor-status');
                if (indicator) {
                    indicator.className = data.tor_running ? 'status-indicator status-online' : 'status-indicator status-offline';
                    indicator.title = data.tor_running ? 'TOR Online' : 'TOR Offline';
                }
            });
    }
    setInterval(checkTorStatus, 5000);
    checkTorStatus();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
