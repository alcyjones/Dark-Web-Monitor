{% extends "base.html" %}
{% block title %}Upload de URLs - Dark Web Monitor{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header">
                <h5><i class="fas fa-upload"></i> Upload de URLs em Massa</h5>
            </div>
            <div class="card-body">
                <p>Faça upload de um arquivo `.txt` contendo uma URL `.onion` por linha para adicionar ao monitoramento.</p>
                
                <form id="uploadForm" method="POST" action="{{ url_for('upload_urls') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Selecione o arquivo .txt:</label>
                        <input class="form-control" type="file" id="fileInput" name="file" accept=".txt" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-upload"></i> Fazer Upload
                    </button>
                </form>
                
                <div id="uploadStatus" class="mt-3" style="display:none;">
                    <div class="alert alert-info" role="alert">
                        <span id="statusMessage"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('uploadForm').addEventListener('submit', function(event) {
    event.preventDefault();
    
    const form = event.target;
    const formData = new FormData(form);
    const uploadStatus = document.getElementById('uploadStatus');
    const statusMessage = document.getElementById('statusMessage');
    
    statusMessage.textContent = 'Enviando arquivo...';
    uploadStatus.style.display = 'block';
    
    fetch(form.action, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            statusMessage.textContent = 'Erro: ' + data.error;
            uploadStatus.className = 'mt-3 alert alert-danger';
        } else {
            statusMessage.textContent = data.message;
            uploadStatus.className = 'mt-3 alert alert-success';
            // Opcional: recarregar a página de URLs após o upload
            // window.location.href = "{{ url_for('urls') }}";
        }
    })
    .catch(error => {
        statusMessage.textContent = 'Erro na comunicação com o servidor: ' + error;
        uploadStatus.className = 'mt-3 alert alert-danger';
    });
});
</script>
{% endblock %}
